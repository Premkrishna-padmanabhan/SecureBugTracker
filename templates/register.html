{% extends "base.html" %}
{% block content %}
<form method="POST">
    <input type="text" name="username" placeholder="Username"><br>
    <input type="password" name="password" placeholder="Password"><br>
    <select name="role">
        <option>Admin</option>
        <option>Developer</option>
        <option>Tester</option>
    </select><br>
    <button type="submit">Register</button>
</form>
{% endblock %}
